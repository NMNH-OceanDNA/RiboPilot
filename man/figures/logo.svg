<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1080" width="1000" height="1080">
  <defs>
    <linearGradient id="hexgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33ABB1"/>
      <stop offset="0.45" stop-color="#17858E"/>
      <stop offset="1" stop-color="#0D555E"/>
    </linearGradient>
    <linearGradient id="strandgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FB6BC"/>
      <stop offset="0.5" stop-color="#12717A"/>
      <stop offset="1" stop-color="#3FB6BC"/>
    </linearGradient>
  </defs>

  <!-- hex ring -->
  <path fill-rule="evenodd" fill="url(#hexgrad)"
        d="M500 55 L920 297 L920 783 L500 1025 L80 783 L80 297 Z
