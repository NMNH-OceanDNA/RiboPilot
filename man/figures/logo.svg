  <!-- nrDNA cistron map -->
  <g>
    <line x1="205" y1="452" x2="795" y2="452" stroke="#12717A" stroke-width="14" stroke-linecap="round"/>
    <rect x="215" y="407" width="205" height="90" rx="18" fill="#178A93"/>
    <rect x="455" y="407" width="90" height="90" rx="18" fill="#F5C518"/>
    <rect x="580" y="407" width="205" height="90" rx="18" fill="#178A93"/>
  </g>
  <!-- wings -->
  <g fill="none" stroke-linecap="round">
    <g>
      <path d="M576 700 Q676 690 782 698" stroke="#35AEB4" stroke-width="40"/>
      <path d="M576 748 Q694 740 802 754" stroke="#F5C518" stroke-width="50"/>
      <path d="M580 792 Q606 796 634 802" stroke="#0D555E" stroke-width="24"/>
    </g>
    <g transform="translate(1000,0) scale(-1,1)">
      <path d="M576 700 Q676 690 782 698" stroke="#35AEB4" stroke-width="40"/>
      <path d="M576 748 Q694 740 802 754" stroke="#F5C518" stroke-width="50"/>
      <path d="M580 792 Q606 796 634 802" stroke="#0D555E" stroke-width="24"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="500" y="620" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, sans-serif"
        font-size="118" font-weight="600" fill="#10535C" letter-spacing="-1">RiboPilot</text>
