<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3aa6b9"/></marker>
  </defs>
  <rect width="1500" height="760" fill="#ffffff"/>
  <text x="30" y="58" font-size="46" fill="#101820">Workflow Overview</text>

  <!-- inputs -->
  <g font-size="19" fill="#101820" text-anchor="middle">
    <text x="130" y="130">Genome skim reads</text>
    <text x="130" y="153">(Illumina)</text>
    <g stroke-width="6" stroke-linecap="round">
      <line x1="60" y1="180" x2="120" y2="180" stroke="#1f6f8b"/><line x1="135" y1="180" x2="200" y2="180" stroke="#f2c100"/>
      <line x1="80" y1="198" x2="170" y2="198" stroke="#3aa6b9"/><line x1="60" y1="216" x2="110" y2="216" stroke="#f2c100"/>
      <line x1="125" y1="216" x2="195" y2="216" stroke="#0b4a5c"/><line x1="90" y1="234" x2="180" y2="234" stroke="#3aa6b9"/>
      <line x1="60" y1="252" x2="130" y2="252" stroke="#0b4a5c"/><line x1="145" y1="252" x2="200" y2="252" stroke="#f2c100"/>
    </g>
    <text x="130" y="330">Your own assemblies</text>
    <text x="130" y="353">(optional)</text>
    <g stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M60 385 q35 -22 70 0 t70 0" stroke="#3aa6b9"/><path d="M70 410 q30 18 60 0 t60 0" stroke="#f2c100"/>
    </g>
    <text x="130" y="500">Sample metadata</text>
    <text x="130" y="523">(optional)</text>
    <g font-size="15" font-weight="bold">
      <rect x="40" y="545" width="80" height="34" rx="6" fill="#e4f0f4" stroke="#c8dde5"/><text x="80" y="567" fill="#1f6f8b">GEOME</text>
      <rect x="130" y="545" width="60" height="34" rx="6" fill="#e4f0f4" stroke="#c8dde5"/><text x="160" y="567" fill="#1f6f8b">GBIF</text>
      <rect x="200" y="545" width="60" height="34" rx="6" fill="#e4f0f4" stroke="#c8dde5"/><text x="230" y="567" fill="#1f6f8b">NCBI</text>
      <rect x="85" y="588" width="130" height="34" rx="6" fill="#e4f0f4" stroke="#c8dde5"/><text x="150" y="610" fill="#1f6f8b">mapping file</text>
    </g>
  </g>
  <g stroke="#3aa6b9" stroke-width="9" marker-end="url(#ah)">
    <line x1="268" y1="215" x2="284" y2="215"/><line x1="268" y1="398" x2="284" y2="398"/><line x1="268" y1="583" x2="284" y2="583"/>
  </g>

  <!-- main panel -->
  <rect x="300" y="95" width="990" height="640" rx="40" fill="#0d1b21" stroke="#3aa6b9" stroke-width="6"/>
  <g fill="#ffffff">
    <g font-size="23" font-weight="bold">
      <text x="330" y="150">1 TAXONOMY</text>
      <text x="515" y="150">2 REFERENCE</text>
      <text x="715" y="150">3 ASSEMBLE</text>
      <text x="905" y="150">4 ANNOTATION</text>
      <text x="930" y="176">REVIEW</text>
      <text x="1125" y="150">5 EXPORT</text>
    </g>
    <g font-size="17">
      <text x="330" y="215">Match each</text><text x="330" y="238">sample to the</text><text x="330" y="261">NCBI taxonomy</text>
      <text x="330" y="296">Check and lock</text>
      <text x="515" y="215">Group related</text><text x="515" y="238">samples</text>
      <text x="515" y="273">Build a database</text><text x="515" y="296">per group from</text><text x="515" y="319">GenBank</text>
      <text x="715" y="215">Clean reads</text>
      <text x="715" y="250">Assemble the</text><text x="715" y="273">rDNA repeat</text>
      <text x="715" y="308">Find the five</text><text x="715" y="331">features</text>
      <text x="715" y="366">Run quality checks</text>
      <text x="905" y="215">Review features</text><text x="905" y="238">and flags</text>
      <text x="905" y="273">Adjust boundaries,</text><text x="905" y="296">trim flanks</text>
      <text x="905" y="331">Keep or drop</text><text x="905" y="354">contigs, then lock</text>
      <text x="1125" y="215">Group records</text>
      <text x="1125" y="250">Write FASTA</text><text x="1125" y="273">with GenBank</text><text x="1125" y="296">headers</text>
      <text x="1125" y="331">Final ITSx check</text>
    </g>
  </g>
  <g stroke="#3aa6b9" stroke-width="2" stroke-dasharray="4 5">
    <line x1="500" y1="125" x2="500" y2="380"/><line x1="700" y1="125" x2="700" y2="380"/><line x1="890" y1="125" x2="890" y2="380"/><line x1="1110" y1="125" x2="1110" y2="380"/>
  </g>

  <!-- repeat graphic: assembled then annotated -->
  <g>
    <text x="545" y="440" font-size="17" fill="#9fd3de" text-anchor="middle">assembled contig</text>
    <rect x="345" y="455" width="400" height="30" rx="15" fill="none" stroke="#3aa6b9" stroke-width="5"/>
    <line x1="760" y1="470" x2="800" y2="470" stroke="#3aa6b9" stroke-width="9" marker-end="url(#ah)"/>
    <text x="1040" y="440" font-size="17" fill="#9fd3de" text-anchor="middle">annotated rDNA repeat</text>
    <line x1="820" y1="470" x2="1260" y2="470" stroke="#5c7780" stroke-width="5"/>
    <g font-size="15" font-weight="bold" text-anchor="middle">
      <rect x="840" y="453" width="120" height="34" rx="5" fill="#f2c100"/><text x="900" y="476" fill="#101820">18S</text>
      <rect x="1000" y="453" width="44" height="34" rx="5" fill="#3aa6b9"/><text x="1022" y="476" fill="#101820" font-size="13">5.8S</text>
      <rect x="1084" y="453" width="160" height="34" rx="5" fill="#f2c100"/><text x="1164" y="476" fill="#101820">28S</text>
      <text x="980" y="512" fill="#ffffff" font-size="14" font-weight="normal">ITS1</text>
      <text x="1064" y="512" fill="#ffffff" font-size="14" font-weight="normal">ITS2</text>
    </g>
  </g>

  <!-- export sample -->
  <g font-family="Menlo, Consolas, monospace" font-size="15">
    <rect x="345" y="560" width="520" height="62" fill="#ffffff"/>
    <text x="357" y="584" fill="#101820">&gt;Sample1 [organism=Upeneus parvus] ...</text>
    <text x="357" y="608" fill="#101820">TACCTGGTTGATCCTGCCAGTAGCATATGCTTGTC</text>
  </g>
  <g font-size="17" fill="#ffffff" text-anchor="middle">
    <text x="1075" y="580">fastp, GetOrganelle, SPAdes,</text>
    <text x="1075" y="604">barrnap, ITSx, BLAST, Nextflow</text>
  </g>
  <text x="795" y="700" font-size="18" fill="#9fd3de" text-anchor="middle">Every step runs in a point-and-click app. Automatic checks flag contaminants, chimeras, and odd features along the way.</text>

  <!-- output -->
  <line x1="1300" y1="415" x2="1340" y2="415" stroke="#3aa6b9" stroke-width="9" marker-end="url(#ah)"/>
  <g text-anchor="middle" fill="#101820">
    <text x="1425" y="330" font-size="26">Submit to</text>
    <text x="1425" y="364" font-size="26">GenBank</text>
    <rect x="1365" y="385" width="120" height="90" rx="14" fill="#2f6d9e"/>
    <text x="1425" y="440" font-size="26" fill="#ffffff" font-weight="bold">NCBI</text>
  </g>
</svg>
