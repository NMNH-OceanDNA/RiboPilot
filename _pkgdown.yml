        href: articles/Your-Own-Project.html
      - text: "Sample metadata"
        href: articles/Sample-Metadata.html
      - text: "Reference databases"
        href: articles/Reference-Databases.html
      - text: "Choosing an assembly method"
        href: articles/Assembly-Methods.html
      - text: "Quality checks and flags"
        href: articles/Curation-Flags.html
