# Conda environment for the unsupported no-container route (local executor).
# Create with:
#   conda env create -f environment.yml
#   conda activate ribopilot
#
# Every tool is pinned to the version in the RiboPilot image (docker/Dockerfile),
# so a conda run and a container run use the same tools. Not included: R and the
# RiboPilot R packages, and ribotyper (not on bioconda; the chimera check skips it).
name: ribopilot
channels:
  - conda-forge
  - bioconda
dependencies:
  # workflow. Range matches RiboPilot's check_nextflow_version(): >=24.10 is the
  # tested floor; <26 avoids the unverified Nextflow 26 line.
  - nextflow>=24.10,<26
  - python=3.12
  - sqlite=3.53.4
  - jq=1.8.2
  # read QC / trimming
  - fastp=0.23.4
  - fastqc=0.12.1
  # assembly + reference recruitment
  - getorganelle=1.7.7.1
  - spades=4.1.0
  # homology / mapping
  - blast=2.17.0
  - bowtie2=2.5.4
  - minimap2=2.28
  - samtools=1.21
  - seqtk=1.5
  - seqkit=2.13.0
  # annotation
  - pybarrnap=0.5.2
  - barrnap=1.10.6
  - itsx=1.1.3
  - hmmer=3.4
  # reference DB building + taxonomy resolution
  - entrez-direct=26.0
  - biopython=1.88
  - ncbi-datasets-cli=18.36.0
