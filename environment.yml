# Conda environment for RiboPilot dev/testing (local executor).
# Create with:
#   conda env create -f environment.yml
#   conda activate ribopilot
#
# Versions are pinned so an env created today and one created in six months run
# the same assembler and annotator. Where docker/Dockerfile pins a tool, the pin
# here is the same version, so the conda path and the container path agree.
name: ribopilot
channels:
  - conda-forge
  - bioconda
dependencies:
  # workflow. Range matches RiboPilot's check_nextflow_version(): >=24.10 is the
  # tested floor; <26 avoids the unverified Nextflow 26 line.
  - nextflow>=24.10,<26
  # read QC / trimming
  - fastp=0.23.4
  - fastqc=0.12.1
  # assembly + reference recruitment
  - getorganelle=1.7.7.1
  - spades=4.1.0
  # homology / mapping
  # >=2.12 required: older builds (e.g. 2.5.0) lack TLS and cannot reach the
  # HTTPS-only NCBI remote BLAST service ("Unavailable feature GNUTLS").
  - blast>=2.12
  - bowtie2=2.5.4
  - minimap2=2.28
  - samtools=1.21
  - seqtk=1.5
  - seqkit=2.13.0
  # contamination screen (optional, added at the contamination increment):
  #   - blobtools
  # annotation
  - pybarrnap=0.5.2   # default rRNA anchor caller (euk-capable barrnap reimplementation)
  # the classic tseemann line the annotation design targets; the 1.10.x series is
  # a different upstream and is not what the GFF handling was written against
  - barrnap=0.9
  - itsx=1.1.3
  - hmmer=3.4
  # reference DB building + taxonomy resolution
  # 24.0, not the newest: blast 2.17 depends on entrez-direct >=24.0,<25
  - entrez-direct=24.0
  - biopython=1.88
  - taxonkit=0.20.0
  - ncbi-datasets-cli=18.34.0
