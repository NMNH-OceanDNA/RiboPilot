# Installs RiboPilot on a fresh runner the way the README says (remotes, so the
# Bioconductor packages come in through biocViews), then runs the tests from the
# source tree with Nextflow, sqlite3, and jq on PATH, and makes the practice
# project from Rscript.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: clean-install

permissions: read-all

jobs:
  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NXF_VER: 25.10.6
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Nextflow, sqlite3, and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 jq
          curl -fsSL https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version

      - name: Install RiboPilot as the README says
        env:
          RP_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          install.packages("remotes")
          remotes::install_github("dmacguigan/RiboPilot", ref = Sys.getenv("RP_REF"))
          stopifnot(requireNamespace("RiboPilot", quietly = TRUE))
        shell: Rscript {0}

      - name: Install rstudioapi (so the RStudio guard in new_project() is exercised)
        run: install.packages("rstudioapi")
        shell: Rscript {0}

      - name: Make the practice project from Rscript
        run: |
          p <- file.path(Sys.getenv("RUNNER_TEMP"), "ribopilot_test")
          RiboPilot::new_test_project(p, n = 0)
          con <- DBI::dbConnect(RSQLite::SQLite(), file.path(p, ".sqlite"))
          stopifnot(file.exists(file.path(p, ".config")),
            identical(sort(DBI::dbGetQuery(con, "SELECT ID FROM samples")$ID), c("CHIM00", "CHIM01")))
        shell: Rscript {0}

      - name: Run the tests from the source tree
        run: |
          install.packages(c("testthat", "withr", "pkgload", "yaml"))
          testthat::test_local()
        shell: Rscript {0}
